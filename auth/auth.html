<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auth</title>
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <div class="fade" id="fade"></div>

  <div class="wrap" id="wrap">
    <!-- LOGIN / REGISTER -->
    <div class="panel" id="panelAuth">
      <div class="panel-edge"></div>

      <div class="header">
        <div class="badge"><span class="badge-dot"></span><span>SECURE</span></div>
        <h1>RolePlay</h1>
        <p class="tagline" id="subtitle">Вход в аккаунт</p>
      </div>

      <form id="authForm" autocomplete="off">
        <div class="field">
          <label>Никнейм</label>
          <div class="control locked">
            <input type="text" id="nickname" readonly tabindex="-1" />
          </div>
        </div>

        <div class="field">
          <label>Пароль</label>
          <div class="control">
            <input type="password" id="password" placeholder="Введите пароль" maxlength="32" />
          </div>
        </div>

        <div class="field" id="confirmField" hidden>
          <label>Повтор пароля</label>
          <div class="control">
            <input type="password" id="password2" placeholder="Повторите пароль" maxlength="32" />
          </div>
        </div>

        <div class="error" id="error" hidden></div>

        <button type="submit" class="submit" id="submitBtn">
          <span class="submit-bg"></span>
          <span class="submit-text" id="btnText">Войти</span>
        </button>
      </form>

      <div class="footer">
        <span id="switchText">Нет аккаунта?</span>
        <button type="button" id="switchBtn">Регистрация</button>
      </div>
    </div>

    <!-- SKIN SELECT -->
    <div class="panel skin-panel" id="panelSkin" hidden>
      <div class="panel-edge"></div>
      <div class="header">
        <h1>Персонаж</h1>
        <p class="tagline" id="skinName">Бездомный 1</p>
      </div>

      <div class="skin-row">
        <button type="button" class="arrow" id="btnPrev">&#10094;</button>
        <button type="button" class="submit skin-pick" id="btnPick">
          <span class="submit-bg"></span>
          <span class="submit-text">Выбрать персонажа</span>
        </button>
        <button type="button" class="arrow" id="btnNext">&#10095;</button>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
